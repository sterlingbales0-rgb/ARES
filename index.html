<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cachy Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div><div class="noise"></div>
<div class="app">
  <aside id="side">
    <div class="side-top">
      <span class="logo"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9Z"/><path d="M12 8v8M8 10l8 4"/></svg></span>
      <span class="brand">cachy<b>/</b>chat</span>
      <button class="ib" id="rail" aria-label="Collapse sidebar" title="Collapse"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <button id="new" class="newbtn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New chat</span><kbd class="lbl">Ctrl K</kbd></button>
    <div id="list"></div>
    <div class="side-bot">
      <button class="ib" id="open-settings" aria-label="Settings" title="Settings"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <button class="ib" id="export" aria-label="Export as Markdown" title="Export as Markdown"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg></button>
    </div>
  </aside>
  <main>
    <header>
      <button class="ib menu" id="menu" aria-label="Open sidebar"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="badge" id="badge-btn" title="Change model"><i></i><span id="badge"></span></button>
    </header>
    <div id="scroll"><div id="wrap">
      <div id="hero">
        <h1>Ask anything.<br><em>Answered at full speed.</em></h1>
        <div class="chips">
          <button class="chip">Explain how a Linux scheduler works</button>
          <button class="chip">Write a bash script to back up my dotfiles</button>
          <button class="chip">Compare Btrfs and ext4 for an SSD</button>
          <button class="chip">Help me debug a segfault in C</button>
        </div>
      </div>
      <div id="msgs"></div><div id="err" hidden></div>
    </div></div>
    <div class="inputbar"><div class="input">
      <span class="prompt">&gt;</span>
      <textarea id="input" rows="1" placeholder="Message the model"></textarea>
      <button id="send" aria-label="Send"></button>
    </div><p class="hint">Enter to send &middot; Shift+Enter for a new line &middot; Esc to stop</p></div>
  </main>
</div>

<div id="modal" hidden><div class="card">
  <div class="row"><h2>Settings</h2><button class="ib" id="close-settings" aria-label="Close"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <label>OpenRouter API key
    <div class="keyrow"><input id="key" type="password" placeholder="sk-or-v1-…" autocomplete="off"><button class="ib" id="showkey" type="button" aria-label="Show or hide key"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <small>Stored only in this browser. Get one at openrouter.ai/keys.</small></label>
  <label>Model <input id="model"></label>
  <div class="two">
    <label>Temperature <span id="tval"></span><input id="temp" type="range" min="0" max="2" step="0.1"></label>
    <label>Max tokens <input id="maxt" type="number" min="1"></label>
  </div>
  <label>System prompt <textarea id="sys" rows="3"></textarea></label>
  <button class="link" id="clear">Clear this chat</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
